# City-G production configuration (profile v0.2).
#
# Copy to cityg.toml in the working directory of cityg-api, or to
# <config dir>/cityg/config.toml. CITYG_<SECTION>_<KEY> environment
# variables override these values. Reference: docs/configuration.md.

[server]
# Bind address; terminate TLS in a reverse proxy in front of it.
address = "0.0.0.0:8080"
# Room journals and snapshots, on durable storage. One process at a time
# may serve a state path: each room has a single writer.
state_path = "/var/lib/cityg/rooms"
# Capacity of the log-head notification channel (WebSocket fan-out).
websocket_capacity = 5000
# Largest n_max a new group may declare (the profile allows 1024). An
# update of a group of n slots is about 1.2 KB * n.
max_group_size = 1024
# Message envelopes stay 7 days, commits 30 days (the latest always stays).
message_retention_secs = 604800
commit_retention_secs = 2592000
# Most entries per room log: messages go first, then the oldest commits.
max_log_entries = 50000
# Lifetime of member session tokens and accepted SessionAuth clock skew.
session_ttl_secs = 3600
auth_skew_secs = 300
# Journal length that triggers a room snapshot.
compact_every = 256

[client]
default_server_url = "https://cityg.example.com"
fetch_poll_interval_secs = 5
fetch_retry_interval_secs = 15
websocket_reconnect_delay_secs = 10

[gui]
default_window_width = 1160.0
default_window_height = 760.0
# Maintenance tick of the GUI: commits other members' leave requests,
# re-keys the device every 24 hours, erases previous-epoch keys.
maintenance_interval_secs = 30

# Deployment notes
#
# - TLS: terminate it in a reverse proxy; members sign every protocol
#   object, but session tokens are bearer secrets.
# - Durability: keep state_path on SSD storage and back it up; a room is
#   rebuilt from its latest snapshot and journal.
# - Scaling: route requests by gid (field 1 of every request body, `gid`
#   query parameter of /v2/ws) so that a room always reaches the same
#   instance, or deploy the Cloudflare Worker (one Durable Object per room).
# - Server blindness: ./scripts/verify_no_secrets.sh checks that the
#   service code never touches group secrets.
