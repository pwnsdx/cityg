# Kubernetes manifest for the City-G v0.2 delivery service (cityg-api).
#
# A room has a single writer: the process that journals it orders its
# commits. This manifest therefore runs one replica with a ReadWriteOnce
# volume and the Recreate strategy, so that two pods never serve the same
# state path. To scale out, run several such deployments and route each
# request by group identifier (field 1 of every protobuf request body,
# `gid` query parameter of /v2/ws), or use the Cloudflare Worker, where each
# room is one Durable Object (crates/cityg-worker).
#
# Usage:
#   kubectl apply -f kubernetes-deployment.yml

---
apiVersion: v1
kind: Namespace
metadata:
  name: cityg
  labels:
    name: cityg

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cityg-config
  namespace: cityg
data:
  CITYG_SERVER_ADDRESS: "0.0.0.0:8080"
  CITYG_SERVER_STATE_PATH: "/var/lib/cityg/rooms"
  CITYG_SERVER_WEBSOCKET_CAPACITY: "2000"
  CITYG_SERVER_MAX_GROUP_SIZE: "256"
  CITYG_SERVER_MESSAGE_RETENTION_SECS: "604800"
  CITYG_SERVER_COMMIT_RETENTION_SECS: "2592000"
  CITYG_SERVER_MAX_LOG_ENTRIES: "50000"
  CITYG_SERVER_SESSION_TTL_SECS: "3600"
  CITYG_SERVER_AUTH_SKEW_SECS: "300"
  CITYG_SERVER_COMPACT_EVERY: "256"
  LOG_FORMAT: "json"
  RUST_LOG: "info"

---
# Room journals and snapshots.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cityg-rooms
  namespace: cityg
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: fast-ssd

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cityg-api
  namespace: cityg
  labels:
    app: cityg-api
    version: v0.2.0
spec:
  replicas: 1
  strategy:
    # Stop the old pod before the new one opens the same journals.
    type: Recreate
  selector:
    matchLabels:
      app: cityg-api
  template:
    metadata:
      labels:
        app: cityg-api
        version: v0.2.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: cityg-api
        image: cityg-api:0.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: cityg-config
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: rooms
          mountPath: /var/lib/cityg
      volumes:
      - name: rooms
        persistentVolumeClaim:
          claimName: cityg-rooms

---
apiVersion: v1
kind: Service
metadata:
  name: cityg-api
  namespace: cityg
  labels:
    app: cityg-api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  selector:
    app: cityg-api

---
# Optional, with the Prometheus Operator.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cityg-api-metrics
  namespace: cityg
  labels:
    app: cityg-api
spec:
  selector:
    matchLabels:
      app: cityg-api
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
