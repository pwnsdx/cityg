[workspace]
members = [
    "crates/msphf-core",
    "crates/anchor-seed",
    "crates/msphf-rlwe",
    "crates/msphf-orchestrator",
    "crates/msphf-lb-vrf",
    "crates/cityg-client",
    "crates/cityg-server",
    "crates/cityg-api",
    "crates/cityg-api-client",
    "crates/dudect-harness", "crates/capss",
    "crates/cityg-gui", "crates/cityg-config",
    "crates/pqcrypto-kyber",
    "crates/cityg-stress",
]
resolver = "2"

[patch.crates-io]
pqcrypto-kyber = { path = "crates/pqcrypto-kyber" }
# GPUI is now consumed from the maintained pwnsdx fork rather than the vendored
# snapshot. This revision includes the semantic material surface layer plus the
# refined cross-platform fallback backend on top of the March 2026 macOS
# backports.
gpui = { git = "https://github.com/pwnsdx/gpui.git", rev = "b10064823ca23971f4dc45cb7b152780dacb1394" }

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Sabri Haddouche"]
repository = "https://github.com/pwnsdx/cityg"

[profile.release]
lto = true              # Link-time optimization for better performance
codegen-units = 1       # Single codegen unit for maximum optimization
opt-level = 3           # Maximum speed optimization

[profile.release-small]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "z"         # Optimize for binary size
strip = true            # Strip debug symbols
