name: cityg

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-features --all-targets --no-deps -- -D warnings -A clippy::never_loop -D clippy::panic -D clippy::unwrap_used -D clippy::expect_used -D clippy::todo -D clippy::unimplemented
      - name: Cargo check (workspace)
        run: cargo check --workspace --all-targets
      - name: Cargo nextest (workspace)
        run: cargo nextest run --workspace --profile ci --exclude dudect-harness
      - name: Security verification (server blindness)
        run: ./scripts/verify_no_secrets.sh
      - name: Dudect harness smoke tests
        run: |
          targets=(
            barrett-reduce
            montgomery-reduce
            montgomery-add
            montgomery-sub
            expand-a
            smallwood-prove
            smallwood-verify
          )
          for target in "${targets[@]}"; do
            echo "Running dudect target: $target"
            if cargo run -p dudect-harness --release -- --target "$target" --samples 20000 --inner 16 --seed 4242 --fail-threshold 4.5; then
              continue
            fi
            echo "Retrying dudect target after first suspicious sample: $target"
            sleep 2
            cargo run -p dudect-harness --release -- --target "$target" --samples 20000 --inner 16 --seed 4242 --fail-threshold 4.5
          done

  release-matrix:
    name: Release Matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cityg-server
            command: cargo test -p cityg-server
            needs_ripgrep: false
            needs_native_linux_deps: false
          - name: cityg-api
            command: cargo test -p cityg-api
            needs_ripgrep: false
            needs_native_linux_deps: false
          - name: cityg-gui-native
            command: cargo test -p cityg-gui --features native-app
            needs_ripgrep: false
            needs_native_linux_deps: true
          - name: client-state-hardening
            command: ./scripts/verify_client_state_hardening.sh
            needs_ripgrep: false
            needs_native_linux_deps: true
          - name: server-blindness
            command: ./scripts/verify_no_secrets.sh
            needs_ripgrep: true
            needs_native_linux_deps: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ripgrep
        if: matrix.needs_ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - name: Install GUI native deps
        if: matrix.needs_native_linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  nightly-chaos:
    name: Nightly Chaos
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GUI native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - name: Build nightly chaos binaries
        run: |
          cargo build -p cityg-api
          cargo build -p cityg-gui --features native-app --bin join_leave
          cargo build -p cityg-stress
      - name: Run nightly chaos campaign
        run: |
          artifact_dir="$RUNNER_TEMP/cityg-stress-nightly"
          cargo run -p cityg-stress -- \
            --server-bind 127.0.0.1:18080 \
            --server-url http://127.0.0.1:18080 \
            --workers 1 \
            --rounds-per-worker 6 \
            --min-count 2 \
            --max-count 2 \
            --leaves-per-room 2 \
            --watch-percent 100 \
            --jitter-max-secs 0 \
            --round-delay-secs 2 \
            --message-burst-count 2 \
            --message-burst-interval-ms 25 \
            --restart-every-secs 45 \
            --client-restart-every-secs 20 \
            --capture-client-state-artifacts \
            --require-metrics \
            --artifact-dir "$artifact_dir" \
            --plain
      - name: Upload nightly chaos artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cityg-nightly-chaos
          path: ${{ runner.temp }}/cityg-stress-nightly

  artifact-build:
    name: Artifact Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cityg-api-release
            command: cargo build --release -p cityg-api
            setup_rust: true
            needs_native_linux_deps: false
          - name: cityg-gui-release
            command: cargo build --release -p cityg-gui --features native-app
            setup_rust: true
            needs_native_linux_deps: true
          - name: docker-image
            command: docker build -f Dockerfile -t cityg-api:ci .
            setup_rust: false
            needs_native_linux_deps: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.setup_rust
      - name: Install GUI native deps
        if: matrix.needs_native_linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - name: Build ${{ matrix.name }}
        run: ${{ matrix.command }}
