name: cityg

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-features --all-targets --no-deps -- -D warnings -A clippy::never_loop -D clippy::panic -D clippy::unwrap_used -D clippy::expect_used -D clippy::todo -D clippy::unimplemented
      - name: Cargo check (workspace)
        run: cargo check --workspace --all-targets
      - name: Cargo nextest (workspace)
        run: cargo nextest run --workspace --profile ci --exclude dudect-harness
      - name: Security verification (server blindness)
        run: ./scripts/verify_no_secrets.sh
      - name: Dudect harness smoke tests
        run: |
          targets=(
            barrett-reduce
            montgomery-reduce
            montgomery-add
            montgomery-sub
            expand-a
            smallwood-prove
            smallwood-verify
          )
          for target in "${targets[@]}"; do
            echo "Running dudect target: $target"
            cargo run -p dudect-harness --release -- --target "$target" --samples 20000 --inner 16 --seed 4242
          done

  release-matrix:
    name: Release Matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cityg-server
            command: cargo test -p cityg-server
            needs_ripgrep: false
          - name: cityg-api
            command: cargo test -p cityg-api
            needs_ripgrep: false
          - name: cityg-gui-native
            command: cargo test -p cityg-gui --features native-app
            needs_ripgrep: false
          - name: server-blindness
            command: ./scripts/verify_no_secrets.sh
            needs_ripgrep: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ripgrep
        if: matrix.needs_ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  artifact-build:
    name: Artifact Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cityg-api-release
            command: cargo build --release -p cityg-api
            setup_rust: true
          - name: cityg-gui-release
            command: cargo build --release -p cityg-gui --features native-app
            setup_rust: true
          - name: docker-image
            command: docker build -f Dockerfile -t cityg-api:ci .
            setup_rust: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.setup_rust
      - name: Build ${{ matrix.name }}
        run: ${{ matrix.command }}
