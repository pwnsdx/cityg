name: cityg

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-features --all-targets --no-deps --locked -- -D warnings -A clippy::never_loop -D clippy::panic -D clippy::unwrap_used -D clippy::expect_used -D clippy::todo -D clippy::unimplemented
      - name: Cargo nextest (workspace)
        run: cargo nextest run --workspace --profile ci --locked
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      - name: Security verification (delivery-service blindness)
        run: ./scripts/verify_no_secrets.sh

  scale:
    name: Scale test (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Windows over a large tree
        run: cargo test -p cityg-core --release --locked --test scale -- --ignored --nocapture

  formal-model:
    name: Symbolic model (ProVerif)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build ProVerif 2.05
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocaml-nox ocaml-findlib
          curl -fsSL https://bblanche.gitlabpages.inria.fr/proverif/proverif2.05.tar.gz -o "$RUNNER_TEMP/proverif.tar.gz"
          echo "4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4  $RUNNER_TEMP/proverif.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/proverif.tar.gz" -C "$RUNNER_TEMP"
          # The interactive simulator needs lablgtk2; the verifier does not.
          cd "$RUNNER_TEMP/proverif2.05" && (./build || test -x proverif)
      - name: Check the verdicts of every scenario
        run: docs/formal/run.sh "$RUNNER_TEMP/proverif2.05/proverif"
