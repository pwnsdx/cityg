[package]
name = "cityg-api-client"
version = "0.2.0"
license = "MIT"
authors = ["Sabri Haddouche"]
edition.workspace = true
description = "City-G v0.2 client: delivery-service HTTP client, invite links and member driver"

[dependencies]
cityg-core = { path = "../cityg-core" }
cityg-proto = { path = "../cityg-proto" }
hex = "0.4"
prost = "0.14"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
