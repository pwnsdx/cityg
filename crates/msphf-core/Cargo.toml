[package]
name = "msphf-core"
version = "0.1.0"
license = "MIT"
authors = ["Sabri Haddouche"]
edition = "2024"

[features]
default = []
unsafe-ntt = []

[dependencies]
sha3 = "0.10"
blake3 = "1.8"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
ciborium = { version = "0.2", features = ["std"] }
serde_bytes = "0.11"
pqcrypto-dilithium = { version = "0.5", default-features = false, features = ["std"] }
pqcrypto-traits = "0.3"
winter-crypto = "0.13.1"
winter-math = "0.13.1"
smallvec = "1.15"

[dev-dependencies]
hex-literal = "0.4"
