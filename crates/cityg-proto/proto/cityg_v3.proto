// City-G v0.3 delivery-service API.
//
// Every request is an HTTP POST of a protobuf message to /v3/<route>, whose
// first field is the group identifier `gid` (32 bytes, the room identifier).
// Protocol objects travel as the exact deterministic-CBOR bytes defined by
// the City-G v0.3 profile (commits, GroupInfo, welcomes, proposals, join
// requests, invites and revocations, envelopes, reports, bindings); the
// delivery service verifies them with cityg-core and never re-encodes them.
//
// Routes that read or write group traffic require a bearer token obtained
// from /v3/groups/session with a SessionAuth signed by a member device key.
syntax = "proto3";

package cityg.v3;

// POST /v3/groups/create — publish the genesis commit of a new group.
message CreateGroupRequest {
  bytes gid = 1;
  bytes commit = 2;
  bytes group_info = 3;
}

message CreateGroupResponse {
  uint64 epoch = 1;
  uint64 seq = 2;
}

// POST /v3/groups/info — public state a joiner, a resyncing member or a
// committer needs.
message GroupInfoRequest {
  bytes gid = 1;
}

message GroupInfoResponse {
  uint64 epoch = 1;
  bytes group_info = 2;
  bytes tree = 3;
  bytes registry = 4;
  // Recorded removal proposals and join requests, in recording order.
  repeated bytes pending_removals = 5;
  repeated bytes pending_joins = 6;
  uint64 head_seq = 7;
}

// POST /v3/groups/commit — publish the next commit, its GroupInfo and one
// welcome per join request it includes, in order.
message PublishCommitRequest {
  bytes gid = 1;
  bytes commit = 2;
  bytes group_info = 3;
  repeated bytes welcomes = 4;
}

message PublishCommitResponse {
  uint64 epoch = 1;
  uint64 seq = 2;
}

// POST /v3/groups/log — ordered commits, proposals and messages after
// `after_seq`.
message FetchLogRequest {
  bytes gid = 1;
  uint64 after_seq = 2;
  uint32 limit = 3;
  // Light members: commit entries carry the proofs they verify them with.
  bool light = 4;
}

message CommitEntry {
  bytes commit = 1;
  bytes group_info = 2;
  // LightCommit: Merkle proofs, against the tree the commit starts from, of
  // the member records its authorization refers to (light fetches only).
  bytes light = 3;
}

message LogEntry {
  uint64 seq = 1;
  uint64 epoch = 2;
  uint64 accepted_at_ms = 3;
  oneof body {
    CommitEntry commit = 4;
    bytes envelope = 5;
    // Recorded removal proposal: messages of its target after this entry
    // are rejected.
    bytes proposal = 6;
    // Recorded join request, waiting for a commit.
    bytes join_request = 7;
  }
}

message FetchLogResponse {
  repeated LogEntry entries = 1;
  // Sequence number of the last entry of the log.
  uint64 head_seq = 2;
  // Oldest sequence number still retained; a client whose position is older
  // missed entries and must resync.
  uint64 first_seq = 3;
}

// POST /v3/groups/remove_proposal — record a signed removal proposal.
message SubmitRemoveProposalRequest {
  bytes gid = 1;
  bytes proposal = 2;
}

message SubmitRemoveProposalResponse {
  // "recorded" or "already_recorded".
  string status = 1;
}

// POST /v3/groups/join_request — record a signed join request.
message SubmitJoinRequestRequest {
  bytes gid = 1;
  bytes request = 2;
}

message SubmitJoinRequestResponse {
  // H_L("proposal-ref", [request]): the name of the request.
  bytes request_ref = 1;
  // "recorded" or "already_recorded".
  string status = 2;
}

// POST /v3/groups/join_status — where a join request stands.
message JoinStatusRequest {
  bytes gid = 1;
  bytes request_ref = 2;
  // A light joiner asks for the LightJoin of the commit's epoch.
  bool light = 3;
}

message JoinStatusResponse {
  // "pending", "committed" or "unknown".
  string status = 1;
  // Committed requests: the epoch of the commit that included the request,
  // the joiner's welcome, and that commit while the log still holds it.
  uint64 epoch = 2;
  bytes welcome = 3;
  CommitEntry commit = 4;
  // Epoch of the group now.
  uint64 current_epoch = 5;
  // LightJoin (registry, occupancies and the joiner's leaf proof), when
  // requested and while the commit's epoch is the current one.
  bytes light_join = 6;
}

// POST /v3/groups/leaf_proofs — Merkle proofs of leaves against the current
// tree hash (light members prove message senders with them).
message LeafProofsRequest {
  bytes gid = 1;
  repeated uint32 leaves = 2;
}

message LeafProofsResponse {
  // Epoch whose tree the proofs are for.
  uint64 epoch = 1;
  // One LeafProof per requested leaf, in order.
  repeated bytes proofs = 2;
}

// POST /v3/groups/invite — store an admin-signed invite.
message PublishInviteRequest {
  bytes gid = 1;
  bytes invite = 2;
}

message PublishInviteResponse {
  bytes invite_id = 1;
}

// POST /v3/groups/invite/get — fetch an invite by identifier.
message GetInviteRequest {
  bytes gid = 1;
  bytes invite_id = 2;
}

message GetInviteResponse {
  bytes invite = 1;
}

// POST /v3/groups/invite/revoke — revoke an invite (admin-signed).
message RevokeInviteRequest {
  bytes gid = 1;
  bytes revocation = 2;
}

message RevokeInviteResponse {
  // References of the pending join requests the revocation dropped.
  repeated bytes dropped = 1;
}

// POST /v3/groups/send — relay a message envelope (bearer token).
message SendMessageRequest {
  bytes gid = 1;
  bytes envelope = 2;
}

message SendMessageResponse {
  uint64 epoch = 1;
  uint64 seq = 2;
}

// POST /v3/groups/cover_failure — record a signed cover-failure report.
message CoverFailureRequest {
  bytes gid = 1;
  bytes report = 2;
}

message CoverFailureResponse {
  uint64 recorded = 1;
}

// POST /v3/groups/session — exchange a SessionAuth for a bearer token.
message OpenSessionRequest {
  bytes gid = 1;
  bytes auth = 2;
}

message OpenSessionResponse {
  bytes token = 1;
  uint64 expires_at_ms = 2;
}

// POST /v3/groups/alias — store a member's signed alias binding.
message BindAliasRequest {
  bytes gid = 1;
  bytes binding = 2;
}

message BindAliasResponse {
  uint64 count = 1;
}

// POST /v3/groups/aliases — alias bindings of current members.
message AliasesRequest {
  bytes gid = 1;
}

message AliasesResponse {
  repeated bytes bindings = 1;
}

// POST /v3/groups/cover_failures — recorded cover-failure reports.
message CoverFailuresRequest {
  bytes gid = 1;
}

message CoverFailuresResponse {
  repeated bytes reports = 1;
}

// Error body of every non-2xx response.
message ErrorResponse {
  string code = 1;
  string message = 2;
}
