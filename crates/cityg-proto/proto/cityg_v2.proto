// City-G v0.2 delivery-service API.
//
// Every request is an HTTP POST of a protobuf message to /v2/<route>, whose
// first field is the group identifier `gid` (32 bytes, the room identifier).
// Protocol objects travel as the exact deterministic-CBOR bytes defined by
// the City-G v0.2 profile (commits, GroupInfo, proposals, invites, envelopes,
// reports, bindings); the delivery service verifies them with cityg-core and
// never re-encodes them.
//
// Routes that read or write group traffic require a bearer token obtained
// from /v2/groups/session with a SessionAuth signed by a member device key.
syntax = "proto3";

package cityg.v2;

// POST /v2/groups/create — publish the genesis commit of a new group.
message CreateGroupRequest {
  bytes gid = 1;
  bytes commit = 2;
  bytes group_info = 3;
}

message CreateGroupResponse {
  uint64 epoch = 1;
  uint64 seq = 2;
}

// POST /v2/groups/info — public state a joiner or a resyncing member needs.
message GroupInfoRequest {
  bytes gid = 1;
}

message GroupInfoResponse {
  uint64 epoch = 1;
  bytes group_info = 2;
  bytes tree = 3;
  bytes roster = 4;
  repeated bytes pending_removals = 5;
  uint64 head_seq = 6;
  bool vacant = 7;
}

// POST /v2/groups/commit — publish the next commit and its GroupInfo.
message PublishCommitRequest {
  bytes gid = 1;
  bytes commit = 2;
  bytes group_info = 3;
}

message PublishCommitResponse {
  uint64 epoch = 1;
  uint64 seq = 2;
}

// POST /v2/groups/log — ordered commits and messages after `after_seq`.
message FetchLogRequest {
  bytes gid = 1;
  uint64 after_seq = 2;
  uint32 limit = 3;
}

message CommitEntry {
  bytes commit = 1;
  bytes group_info = 2;
}

message LogEntry {
  uint64 seq = 1;
  uint64 epoch = 2;
  uint64 accepted_at_ms = 3;
  oneof body {
    CommitEntry commit = 4;
    bytes envelope = 5;
    // Recorded removal proposal: messages of its target after this entry
    // are rejected.
    bytes proposal = 6;
  }
}

message FetchLogResponse {
  repeated LogEntry entries = 1;
  // Sequence number of the last entry of the log.
  uint64 head_seq = 2;
  // Oldest sequence number still retained; a client whose position is older
  // missed entries and must resync.
  uint64 first_seq = 3;
}

// POST /v2/groups/remove_proposal — record a signed removal proposal.
message SubmitRemoveProposalRequest {
  bytes gid = 1;
  bytes proposal = 2;
}

message SubmitRemoveProposalResponse {
  // "recorded" or "already_recorded".
  string status = 1;
  // True when every member has a recorded removal.
  bool vacant = 2;
}

// POST /v2/groups/invite — store an admin-signed invite.
message PublishInviteRequest {
  bytes gid = 1;
  bytes invite = 2;
}

message PublishInviteResponse {
  bytes invite_id = 1;
}

// POST /v2/groups/invite/get — fetch an invite by identifier.
message GetInviteRequest {
  bytes gid = 1;
  bytes invite_id = 2;
}

message GetInviteResponse {
  bytes invite = 1;
}

// POST /v2/groups/send — relay a message envelope (bearer token).
message SendMessageRequest {
  bytes gid = 1;
  bytes envelope = 2;
}

message SendMessageResponse {
  uint64 epoch = 1;
  uint64 seq = 2;
}

// POST /v2/groups/cover_failure — record a signed cover-failure report.
message CoverFailureRequest {
  bytes gid = 1;
  bytes report = 2;
}

message CoverFailureResponse {
  uint64 recorded = 1;
}

// POST /v2/groups/session — exchange a SessionAuth for a bearer token.
message OpenSessionRequest {
  bytes gid = 1;
  bytes auth = 2;
}

message OpenSessionResponse {
  bytes token = 1;
  uint64 expires_at_ms = 2;
}

// POST /v2/groups/alias — store a member's signed alias binding.
message BindAliasRequest {
  bytes gid = 1;
  bytes binding = 2;
}

message BindAliasResponse {
  uint64 count = 1;
}

// POST /v2/groups/aliases — alias bindings of current members.
message AliasesRequest {
  bytes gid = 1;
}

message AliasesResponse {
  repeated bytes bindings = 1;
}

// POST /v2/groups/cover_failures — recorded cover-failure reports.
message CoverFailuresRequest {
  bytes gid = 1;
}

message CoverFailuresResponse {
  repeated bytes reports = 1;
}

// Error body of every non-2xx response.
message ErrorResponse {
  string code = 1;
  string message = 2;
}
