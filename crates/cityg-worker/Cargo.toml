[package]
name = "cityg-worker"
version = "0.2.0"
license = "MIT"
authors = ["Sabri Haddouche"]
edition.workspace = true
readme = "README.md"
description = "Cloudflare Worker transport of the City-G v0.2 delivery service"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
cloudflare = ["dep:wasm-bindgen", "dep:worker"]

[dependencies]
cityg-config = { path = "../cityg-config" }
cityg-core = { path = "../cityg-core" }
cityg-proto = { path = "../cityg-proto" }
cityg-runtime = { path = "../cityg-runtime" }
cityg-server = { path = "../cityg-server" }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = { version = "0.2", optional = true }
worker = { version = "0.7.5", optional = true }

[dev-dependencies]
prost = "0.14"
rand_chacha = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_v03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
