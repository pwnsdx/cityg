[package]
name = "cityg-cite"
version = "0.4.0-draft.1"
license = "MIT"
authors = ["Sabri Haddouche"]
edition.workspace = true
description = "City-G profile v0.4-draft (Cité): district commits and seals per window, taints, district welcomes, zero-online operation and an in-memory delivery service (prototype, no I/O)"
publish = false

[dependencies]
blake3 = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
ciborium = "0.2"
cityg-core = { path = "../cityg-core" }
cityg-pqc = { path = "../cityg-pqc" }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
rand_chacha = "0.3"
