syntax = "proto3";

package cityg.api.v1;

// Wire compatibility guidelines:
// - New, breaking wire formats must live under a new package (cityg.api.v{N}).
// - Field numbers 1000-1999 are intentionally reserved in every message so we
//   can retire fields without risking accidental reuse.

message AcceptEpochRequest {
  reserved 1000 to 1999;
  bytes bundle_cbor = 1;
}

message AcceptEpochResponse {
  reserved 1000 to 1999;
  bytes we_epoch_id = 1;
  bytes wid = 2;
  bytes parent_root = 3;
  bytes new_root = 4;
}

message MembersRequest {
  reserved 1000 to 1999;
  bytes gid = 1;
  bytes parent_root = 2; // optional: empty for latest
  optional uint64 offset = 3;
  optional uint32 limit = 4;
}

// Identity binding - cryptographically binds alias to device key
message IdentityBinding {
  reserved 1000 to 1999;
  string alias = 1;
  bytes pop_public_key = 2;  // ML-DSA-65 public key (48 bytes)
  bytes signature = 3;        // ML-DSA-65 signature over CBOR([alias, pop_public_key])
}

message FsForwardLeapPolicy {
  reserved 1000 to 1999;
  uint64 h = 1;
  uint64 checkpoint_interval = 2;
  uint64 slack_anchor = 3;
  uint64 slack_first_device = 4;
  uint64 slack_device = 5;
}

message Member {
  reserved 1000 to 1999;
  bytes leaf_id = 1;
  optional string alias = 2;           // Display name if known
  optional bytes pop_public_key = 3;   // Device public key
  optional uint64 join_date = 4;       // Unix timestamp (milliseconds) when member joined
  optional uint64 last_seen = 5;       // Unix timestamp (milliseconds) of last activity
}

message MembersResponse {
  reserved 1000 to 1999;
  repeated Member members = 1;
  bytes root = 2;
  uint64 total_count = 3;
  uint64 next_offset = 4;
}

message SearchMembersRequest {
  reserved 1000 to 1999;
  bytes gid = 1;
  string query = 2;                    // Search query (alias or partial leaf_id hex)
  bytes parent_root = 3;               // optional: empty for latest
  optional uint64 offset = 4;
  optional uint32 limit = 5;
}

message SearchMembersResponse {
  reserved 1000 to 1999;
  repeated Member members = 1;
  bytes root = 2;
  uint64 total_count = 3;
  uint64 next_offset = 4;
}

message SendMessageRequest {
  reserved 1000 to 1999;
  bytes we_epoch_id = 1;
  bytes ciphertext = 2;
  bytes sender = 3;
}

message SendMessageResponse {
  reserved 1000 to 1999;
  string status = 1;
}

message FetchMessagesRequest {
  reserved 1000 to 1999;
  bytes we_epoch_id = 1;
  bytes leaf_id = 2;
}

message ChatMessage {
  reserved 1000 to 1999;
  bytes ciphertext = 1;
  bytes we_epoch_id = 2;
  bytes sender = 3;
  uint64 timestamp_ms = 4;
}

message FetchMessagesResponse {
  reserved 1000 to 1999;
  repeated ChatMessage messages = 1;
}

message HealthResponse {
  reserved 1000 to 1999;
  string status = 1;
}

message GetBundleRequest {
  reserved 1000 to 1999;
  bytes we_epoch_id = 1;
}

message GetBundleResponse {
  reserved 1000 to 1999;
  bytes bundle_cbor = 1;
}

message GetWindowRequest {
  reserved 1000 to 1999;
}

message WindowHead {
  reserved 1000 to 1999;
  bytes we_epoch_id = 1;
  bytes msphf_hp_commit = 2;
  bytes seed_ctx_hash = 3;
  bytes rho_commit = 4;
  bytes seed_commit = 5;
  bytes xk_hash = 6;
  uint64 accept_seq = 7;
  uint64 age_ms = 8;
}

message WindowEntry {
  reserved 1000 to 1999;
  bytes wid = 1;
  repeated WindowHead heads = 2;
}

message GetWindowResponse {
  reserved 1000 to 1999;
  repeated WindowEntry entries = 1;
}

message GetTelemetryRequest {
  reserved 1000 to 1999;
}

message TelemetryEntry {
  reserved 1000 to 1999;
  bytes gid = 1;
  bytes parent_root = 2;
  uint64 head_attempts = 3;
  uint64 head_insertions = 4;
  uint64 freeze_window_full = 5;
  uint64 freeze_rho_replay = 6;
  uint64 last_active_heads = 7;
  uint64 barrier_n_max = 8;
  uint64 barrier_active_leaf_count = 9;
  uint64 barrier_revoked_leaf_count = 10;
  uint64 barrier_pending_join_ticket_count = 11;
  uint64 barrier_reserved_cover_leaf_count = 12;
  uint64 barrier_remaining_cover_leaf_slots = 13;
  uint64 barrier_leaf_utilization_basis_points = 14;
  uint64 barrier_leaf_capacity_warning_percent = 15;
  uint64 barrier_leaf_capacity_refusal_percent = 16;
}

message FreezeStat {
  reserved 1000 to 1999;
  uint32 code = 1;
  string reason = 2;
  uint64 count = 3;
}

message GetTelemetryResponse {
  reserved 1000 to 1999;
  repeated TelemetryEntry entries = 1;
  repeated FreezeStat freeze_stats = 2;
}

message SeedHeadRequest {
  reserved 1000 to 1999;
  bytes bundle_cbor = 1;
}

message SeedHeadResponse {
  reserved 1000 to 1999;
}

message RefreshPivotRequest {
  reserved 1000 to 1999;
  bytes bundle_cbor = 1;
}

message RefreshPivotResponse {
  reserved 1000 to 1999;
}

message ConfigureWindowRequest {
  reserved 1000 to 1999;
  optional uint32 h_max = 1;
  optional uint32 ttl_ms = 2;
}

message ConfigureWindowResponse {
  reserved 1000 to 1999;
  uint32 h_max = 1;
  uint32 ttl_ms = 2;
}

message JoinTicketRequest {
  reserved 1000 to 1999;
  string room_id = 1;
  string alias = 2;                       // DEPRECATED - use identity_binding instead
  optional IdentityBinding identity_binding = 3;
}

message JoinTicketResponse {
  reserved 1000 to 1999;
  bytes gid = 1;
  bytes cat = 2;
  bytes parent_root = 3;
  bytes revoked_root = 4;
  bytes revoked_since_root = 5;
  bytes tswe_salt_hash = 6;
  bytes join_delta_root = 7;
  bytes leaf_id = 8;
  bytes pox_r_commit = 9;
  bytes witness_cbor = 10;
  bytes srx_cbor = 11;
  string msphf_crs_id = 12;
  string msphf_params_id = 13;
  string proof_mode = 14;
  string vrf_id = 15;
  string policy_version = 16;
  string fs_policy_version = 17;
  uint64 fs_epoch_base_ts = 18;
  bytes kbroad_public = 19;
  bytes bootstrap_public = 20;
  optional IdentityBinding confirmed_binding = 21;  // Server confirms the binding
  uint64 kbroad_generation = 22;
  uint64 barrier_version = 23;
  string profile_version = 24;
  uint64 slot_index = 25;
  uint64 slot_generation = 51;
  reserved 26, 35, 45;
  bytes kem_tree_hash_after = 27;
  uint64 n_max = 28;
  uint64 max_barrier_update_bytes = 29;
  bytes current_history_view_id = 30;
  optional HistoryCommitment current_history_commitment = 31;
  bytes current_barrier_update = 32;
  bytes current_predecessor_kem_tree_hash_after = 33;
  repeated BarrierJoinOccupancyRecord current_join_records = 34;
  repeated BarrierRevokedOccupancyRecord current_revoked_records = 49;
  bytes join_finalize_auth_token = 36;
  bytes provisioning_nonce = 37;
  uint64 provisioning_issued_at_ms = 38;
  uint64 provisioning_expires_at_ms = 39;
  optional FsForwardLeapPolicy fs_forward_leap_policy = 40;
  uint64 last_accepted_ec = 41;
  bytes history_authority_descriptor = 42;
  bytes current_global_history_attestation = 43;
  bytes current_join_records_completeness_attestation = 44;
  bytes current_revoked_records_completeness_attestation = 50;
  string history_authority_extension = 46;
  bytes provisioning_artifact = 47;
  bytes deployment_profile_manifest = 48;
}

message MergeTicketRequest {
  reserved 1000 to 1999;
  string room_id = 1;
  bytes leaf_id = 2;
  MergeTicketIntent intent = 3;
}

enum MergeTicketIntent {
  MERGE_TICKET_INTENT_LEAVE = 0;
  MERGE_TICKET_INTENT_REFRESH = 1;
}

message MergeTicketResponse {
  reserved 1000 to 1999;
  bytes we_epoch_id = 1;
  repeated bytes pivot_parity_cbor = 2;
  bytes witness_cbor = 3;
  string proof_mode = 4;
  string vrf_id = 5;
  string policy_version = 6;
  bytes kbroad_public = 7;
  bytes cat = 8;
  bytes parent_root = 9;
  bytes join_delta_root = 10;
  bytes revoked_since_root = 11;
  bytes revoked_root = 12;
  bytes tswe_salt_hash = 13;
  bytes pox_r_commit = 14;
  bytes srx_cbor = 15;
  string msphf_crs_id = 16;
  string msphf_params_id = 17;
  string fs_policy_version = 18;
  uint64 fs_epoch_base_ts = 19;
  uint64 kbroad_generation = 20;
  uint64 barrier_version = 21;
  string profile_version = 22;
  uint64 slot_index = 23;
  uint64 slot_generation = 37;
  reserved 24;
  bytes kem_tree_hash_after = 25;
  uint64 n_max = 26;
  uint64 max_barrier_update_bytes = 27;
  bytes current_history_view_id = 28;
  optional HistoryCommitment current_history_commitment = 29;
  optional FsForwardLeapPolicy fs_forward_leap_policy = 30;
  uint64 last_accepted_ec = 31;
  bytes history_authority_descriptor = 32;
  bytes current_global_history_attestation = 33;
  string history_authority_extension = 34;
  bytes merge_ticket_artifact = 35;
  bytes deployment_profile_manifest = 36;
}

message BarrierResolveRevokedLeavesRequest {
  reserved 1000 to 1999;
  string room_id = 1;
  bytes revocation_roots_hash = 2;
  uint32 page_offset = 3;
  uint32 max_entries = 4;
}

message BarrierResolveRevokedLeavesResponse {
  reserved 1, 1000 to 1999;
  bytes history_view_id = 2;
  optional HistoryCommitment history_commitment = 3;
  uint32 page_offset = 4;
  optional uint32 next_page_offset = 5;
  uint32 total_entries = 6;
  bytes helper_completeness_attestation = 7;
  bytes history_authority_descriptor = 8;
  bytes global_history_attestation = 9;
  string history_authority_extension = 10;
  string profile_version = 11;
  uint64 n_max = 12;
  uint64 max_barrier_update_bytes = 13;
  optional FsForwardLeapPolicy fs_forward_leap_policy = 14;
  bytes deployment_profile_manifest = 15;
  repeated BarrierRevokedOccupancyRecord records = 16;
}

message BarrierResolveRevokedOccupanciesRequest {
  reserved 1000 to 1999;
  string room_id = 1;
  bytes revocation_roots_hash = 2;
  uint32 page_offset = 3;
  uint32 max_entries = 4;
}

message BarrierResolveRevokedOccupanciesResponse {
  reserved 1, 1000 to 1999;
  bytes history_view_id = 2;
  optional HistoryCommitment history_commitment = 3;
  uint32 page_offset = 4;
  optional uint32 next_page_offset = 5;
  uint32 total_entries = 6;
  bytes helper_completeness_attestation = 7;
  bytes history_authority_descriptor = 8;
  bytes global_history_attestation = 9;
  string history_authority_extension = 10;
  string profile_version = 11;
  uint64 n_max = 12;
  uint64 max_barrier_update_bytes = 13;
  optional FsForwardLeapPolicy fs_forward_leap_policy = 14;
  bytes deployment_profile_manifest = 15;
  repeated BarrierRevokedOccupancyRecord records = 16;
}

message BarrierRevokedOccupancyRecord {
  reserved 1000 to 1999;
  uint32 slot_index = 1;
  uint64 slot_generation = 2;
}

message BarrierJoinOccupancyRecord {
  reserved 1000 to 1999;
  bytes device_pk = 1;
  uint32 slot_index = 2;
  bytes ek_leaf = 3;
  uint64 slot_generation = 4;
}

message BarrierResolveJoinsSinceRequest {
  reserved 1000 to 1999;
  string room_id = 1;
  uint64 prev_barrier_version = 2;
  uint32 page_offset = 3;
  uint32 max_entries = 4;
}

message BarrierResolveJoinsSinceResponse {
  reserved 1000 to 1999;
  repeated BarrierJoinOccupancyRecord records = 1;
  bytes history_view_id = 2;
  optional HistoryCommitment history_commitment = 3;
  uint32 page_offset = 4;
  optional uint32 next_page_offset = 5;
  uint32 total_entries = 6;
  bytes helper_completeness_attestation = 7;
  bytes history_authority_descriptor = 8;
  bytes global_history_attestation = 9;
  string history_authority_extension = 10;
  string profile_version = 11;
  uint64 n_max = 12;
  uint64 max_barrier_update_bytes = 13;
  optional FsForwardLeapPolicy fs_forward_leap_policy = 14;
  bytes deployment_profile_manifest = 15;
}

message BarrierResolveJoinOccupanciesSinceRequest {
  reserved 1000 to 1999;
  string room_id = 1;
  uint64 prev_barrier_version = 2;
  uint32 page_offset = 3;
  uint32 max_entries = 4;
}

message BarrierResolveJoinOccupanciesSinceResponse {
  reserved 1000 to 1999;
  repeated BarrierJoinOccupancyRecord records = 1;
  bytes history_view_id = 2;
  optional HistoryCommitment history_commitment = 3;
  uint32 page_offset = 4;
  optional uint32 next_page_offset = 5;
  uint32 total_entries = 6;
  bytes helper_completeness_attestation = 7;
  bytes history_authority_descriptor = 8;
  bytes global_history_attestation = 9;
  string history_authority_extension = 10;
  string profile_version = 11;
  uint64 n_max = 12;
  uint64 max_barrier_update_bytes = 13;
  optional FsForwardLeapPolicy fs_forward_leap_policy = 14;
  bytes deployment_profile_manifest = 15;
}

message BarrierFetchPublicTreeRequest {
  reserved 1000 to 1999;
  string room_id = 1;
  bytes kem_tree_hash_after = 2;
  uint32 entry_offset = 3;
  uint32 max_entries = 4;
}

message BarrierFetchPublicTreeResponse {
  reserved 1000 to 1999;
  uint64 n_max = 1;
  bytes kem_tree_hash_after = 2;
  repeated bytes pk_entries = 3;
  bytes history_view_id = 4;
  optional HistoryCommitment history_commitment = 5;
  uint32 entry_offset = 6;
  optional uint32 next_entry_offset = 7;
  uint32 total_entries = 8;
  bytes helper_completeness_attestation = 9;
  bytes history_authority_descriptor = 10;
  bytes global_history_attestation = 11;
  string history_authority_extension = 12;
  string profile_version = 13;
  uint64 max_barrier_update_bytes = 14;
  optional FsForwardLeapPolicy fs_forward_leap_policy = 15;
  bytes deployment_profile_manifest = 16;
}

enum MergeAcceptanceStatus {
  MERGE_ACCEPTANCE_STATUS_PENDING = 0;
  MERGE_ACCEPTANCE_STATUS_ACCEPTED = 1;
  MERGE_ACCEPTANCE_STATUS_SUPERSEDED = 2;
  MERGE_ACCEPTANCE_STATUS_FINAL_REJECTED = 3;
}

message BarrierLookupMergeAcceptanceRequest {
  reserved 1000 to 1999;
  string room_id = 1;
  uint64 pending_barrier_version = 2;
  bytes pending_barrier_update_digest = 3;
  bytes pending_we_epoch_id = 4;
}

message BarrierLookupMergeAcceptanceResponse {
  reserved 1000 to 1999;
  MergeAcceptanceStatus status = 1;
  bytes history_view_id = 2;
  optional uint64 accepted_barrier_version = 3;
  optional uint64 accepted_fs_ec = 4;
  optional uint64 accepted_reason = 5;
  optional bytes accepted_digest = 6;
  optional HistoryCommitment history_commitment = 7;
  bytes history_authority_descriptor = 8;
  bytes global_history_attestation = 9;
  string history_authority_extension = 10;
  string profile_version = 11;
  uint64 n_max = 12;
  uint64 max_barrier_update_bytes = 13;
  optional FsForwardLeapPolicy fs_forward_leap_policy = 14;
  bytes deployment_profile_manifest = 15;
}

message BarrierIssueFullVerificationWitnessRequest {
  reserved 1000 to 1999;
  string room_id = 1;
  bytes author_leaf_id = 2;
  uint64 barrier_update_reason = 3;
  bytes barrier_update = 4;
  optional HistoryCommitment current_history_commitment = 5;
  bytes current_global_history_attestation = 6;
  uint64 joins_prev_barrier_version = 7;
  repeated BarrierJoinOccupancyRecord join_records = 8;
  bytes revocation_roots_hash = 9;
  reserved 10;
  bytes deployment_profile_manifest = 11;
  bytes revocation_target_leaf_id = 12;
  bytes merge_ticket_artifact = 13;
  uint64 updater_slot_generation = 14;
  repeated BarrierRevokedOccupancyRecord revoked_records = 15;
  bool include_updater_in_revoked_set = 16;
}

message BarrierIssueFullVerificationWitnessResponse {
  reserved 1000 to 1999;
  bytes full_verification_witness = 1;
}

message HistoryCommitment {
  reserved 1000 to 1999;
  bytes history_view_id = 1;
  bytes history_commitment_id = 2;
  bytes prev_history_commitment_id = 3;
  uint64 history_seq = 4;
}

message RoomAdminProof {
  reserved 1000 to 1999;
  bytes pop_public_key = 1;  // ML-DSA-87 public key (Dilithium5)
  bytes signature = 2;       // Signature over CBOR([op, room_id, payload_bytes])
}

message BootstrapRoomRequest {
  reserved 1000 to 1999;
  string room_id = 1;
  bytes kbroad_public = 2;
  optional RoomAdminProof admin_proof = 3;
}

message BootstrapRoomResponse {
  reserved 1000 to 1999;
  string status = 1;
}

message RotateRoomKbroadRequest {
  reserved 1000 to 1999;
  string room_id = 1;
  bytes kbroad_public = 2;
  optional RoomAdminProof admin_proof = 3;
}

message RotateRoomKbroadResponse {
  reserved 1000 to 1999;
  string status = 1;
  uint64 kbroad_generation = 2;
}

message RoomAdminMutationRequest {
  reserved 1000 to 1999;
  string room_id = 1;
  bytes target_pop_public_key = 2;
  optional RoomAdminProof admin_proof = 3;
}

message RoomAdminMutationResponse {
  reserved 1000 to 1999;
  string status = 1;
  uint64 admin_count = 2;
}

message ExpelMemberTicketRequest {
  reserved 1000 to 1999;
  string room_id = 1;
  bytes author_leaf_id = 2;
  bytes target_leaf_id = 3;
  optional RoomAdminProof admin_proof = 4;
}

message ListRoomAdminsRequest {
  reserved 1000 to 1999;
  string room_id = 1;
  optional RoomAdminProof admin_proof = 2;
}

message ListRoomAdminsResponse {
  reserved 1000 to 1999;
  repeated bytes admin_pop_public_keys = 1;
}
