[package]
name = "cityg-api"
version = "0.3.0"
license = "MIT"
authors = ["Sabri Haddouche"]
edition.workspace = true
description = "Native HTTP server of the City-G v0.3 delivery service"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros", "ws"] }
cityg-config = { path = "../cityg-config" }
cityg-core = { path = "../cityg-core" }
cityg-proto = { path = "../cityg-proto" }
cityg-runtime = { path = "../cityg-runtime" }
cityg-server = { path = "../cityg-server" }
futures = "0.3"
hex = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
cityg-api-client = { path = "../cityg-api-client" }
tempfile = "3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
