[package]
name = "capss"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
blake3 = "1"
ark-ff = "0.4"
ark-std = "0.4"
ark-bn254 = "0.4"
ark-sponge = { version = "0.4.0-alpha", default-features = true }
poseidon-bn128 = "0.1.1"
scalarff = { version = "0.4.3", features = ["alt_bn128"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
serde_json = "1"
ark-poly = "0.4"
sha3 = "0.10"

[dev-dependencies]
num-bigint = "0.4"
