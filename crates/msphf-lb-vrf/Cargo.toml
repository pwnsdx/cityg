[package]
name = "msphf-lb-vrf"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = [
    "City-G Crypto Team",
    "Zhenfei Zhang <zhenfei.zhang@hotmail.com>",
]
description = "Lattice-based VRF (Module-SIS/LWE) adapted for the City-G stack"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[features]
bench = []

[dependencies]
libc = "0.2"
rand = { version = "0.8", features = ["std"] }
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
thiserror = "1"
subtle = "2.6"
blake3 = "1.8"


[dev-dependencies]
bencher = "0.1.5"
criterion = "0.5"
proptest = "1.10"


[[bench]]
name = "basic"
harness = false
required-features = ["bench"]
