[package]
name = "pqcrypto-kyber"
version = "0.8.1"
edition = "2024"
license = "MIT"
description = "City-G local compatibility shim exposing pqcrypto-kyber::kyber768 API backed by ml-kem"

[features]
default = ["std"]
std = ["pqcrypto-traits/std", "ml-kem/getrandom"]

[dependencies]
ml-kem = { version = "0.3.0-rc.0", default-features = false }
pqcrypto-traits = { version = "0.3", default-features = false }
