[package]
name = "cityg-gui"
version = "0.2.0"
edition = "2024"
description = "City-G graphical client built with gpui"
default-run = "cityg-gui"

[features]
default = []
native-app = ["dep:gpui", "dep:gpui-macros"]

[dependencies]
gpui = { version = "0.2.2", optional = true }
gpui-macros = { version = "0.2.2", optional = true }
cityg-api-client = { path = "../cityg-api-client" }
cityg-config = { path = "../cityg-config" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-tungstenite = "0.29"
futures = "0.3"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
rand = "0.10"
cityg-pqc = { path = "../cityg-pqc" }
hex = "0.4"
dirs = "6"
blake3 = "1"
humantime = "2"
chacha20poly1305 = { version = "0.10", features = ["std"] }
ahash = { version = "0.8", features = ["serde"] }
zeroize = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Keep core-text aligned with gpui/zed-font-kit's core-graphics expectations.
core-text = "=21.0.0"
cocoa = "0.26.0"
objc = "0.2.7"
raw-window-handle = "0.6.2"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
tempfile = "3"
cityg-api = { path = "../cityg-api" }
cityg-runtime = { path = "../cityg-runtime" }
axum = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }

[[bin]]
name = "join_leave"
path = "src/bin/join_leave.rs"
