[package]
name = "cityg-core"
version = "0.4.0"
license = "MIT"
authors = ["Sabri Haddouche"]
edition.workspace = true
description = "City-G protocol core: a tree split into districts under a city, district commits and seals per window, welcomes, zero-online operation, and an in-memory delivery service (no I/O)"
publish = false

[dependencies]
blake3 = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
ciborium = "0.2"
cityg-pqc = { path = "../cityg-pqc" }
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2"
thiserror = "2"
x-wing = { version = "0.1.0", features = ["hazmat", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
rand_chacha = "0.3"
