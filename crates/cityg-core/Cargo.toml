[package]
name = "cityg-core"
version = "0.3.0"
license = "MIT"
authors = ["Sabri Haddouche"]
edition.workspace = true
description = "City-G v0.3 protocol core: ratchet tree, key schedule, commits, batched joins, admission and message plane (no I/O)"

[dependencies]
blake3 = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
ciborium = "0.2"
cityg-pqc = { path = "../cityg-pqc" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
x-wing = { version = "0.1.0", features = ["hazmat", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
rand_chacha = "0.3"
serde_json = "1"
