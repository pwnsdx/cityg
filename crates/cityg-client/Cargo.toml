[package]
name = "cityg-client"
version = "0.1.0"
license = "MIT"
authors = ["Sabri Haddouche"]
edition.workspace = true

[features]
default = ["demo-fixtures"]
demo-fixtures = ["dep:dirs"]

[dependencies]
anyhow = "1"
anchor-seed = { path = "../anchor-seed" }
chacha20poly1305 = { version = "0.10", features = ["std"] }
ciborium = "0.2"
hex = "0.4"
ml-kem = { version = "0.3.0-rc.0", features = ["getrandom"] }
msphf-core = { path = "../msphf-core" }
msphf-orchestrator = { path = "../msphf-orchestrator" }
pqcrypto-dilithium = { version = "0.5", default-features = false, features = ["std"] }
pqcrypto-traits = "0.3"
pqcrypto-kyber = "0.8"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
dirs = { version = "6", optional = true }
zeroize = "1"
