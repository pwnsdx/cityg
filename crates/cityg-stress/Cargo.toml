[package]
name = "cityg-stress"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "cityg-stress"
path = "src/main.rs"
test = false
bench = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = "0.30"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "process", "sync", "time", "signal", "io-util"] }
cityg-api-client = { path = "../cityg-api-client" }
cityg-client = { path = "../cityg-client" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
