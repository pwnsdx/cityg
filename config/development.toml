# City-G development configuration (profile v0.2).

[server]
# Bind address of the native delivery service.
address = "127.0.0.1:8080"
# Room journals: without a state path rooms live in memory only.
# state_path = "./cityg-state"
# Capacity of the log-head notification channel.
websocket_capacity = 1000
# Largest n_max a new group may declare (the profile allows up to 1024).
max_group_size = 256
# How long message envelopes stay in a room log (7 days).
message_retention_secs = 604800
# How long commits stay in a room log (30 days; the latest always stays).
commit_retention_secs = 2592000
# Most entries kept in a room log; the oldest messages go first.
max_log_entries = 50000
# Lifetime of a member session token (1 hour).
session_ttl_secs = 3600
# Accepted clock difference of a signed session request (5 minutes).
auth_skew_secs = 300
# Journal length that triggers a room snapshot.
compact_every = 256

[client]
# Server URL proposed by the join form.
default_server_url = "http://127.0.0.1:8080"
# Interval between room log polls (seconds); log-head notices trigger
# syncs sooner.
fetch_poll_interval_secs = 3
# Delay before retrying a failed sync (seconds).
fetch_retry_interval_secs = 10
# Delay before reconnecting the notification socket (seconds).
websocket_reconnect_delay_secs = 5

[gui]
default_window_width = 1160.0
default_window_height = 760.0
# Maintenance tick: commits other members' leave requests, re-keys this
# device every 24 hours, erases previous-epoch keys after the grace window.
maintenance_interval_secs = 30
