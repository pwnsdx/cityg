# City-G blue/green configuration (profile v0.3).
#
# A room has exactly one writer: the process that journals it orders its
# commits. Two native instances must therefore never serve the same room
# from the same state path at the same time. Supported shapes:
#
# - blue/green hand-off: stop blue, then start green on the same
#   state_path; green replays the snapshots and journals, and clients
#   resume from their log position;
# - sharding: route requests by group identifier (field 1 of every request
#   body, `gid` query parameter of /v2/ws) so that each room maps to one
#   instance;
# - the Cloudflare Worker, where each room is one Durable Object.

[server]
address = "0.0.0.0:8443"
state_path = "/var/lib/cityg/rooms"
websocket_capacity = 20000
max_group_size = 1024
message_retention_secs = 604800
commit_retention_secs = 2592000
max_log_entries = 100000
# Short sessions: members open a new one after a hand-off anyway.
session_ttl_secs = 900
auth_skew_secs = 300
compact_every = 128

[client]
default_server_url = "https://cityg.example.com"
fetch_poll_interval_secs = 5
fetch_retry_interval_secs = 15
websocket_reconnect_delay_secs = 5

[gui]
default_window_width = 1160.0
default_window_height = 760.0
maintenance_interval_secs = 30
